<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>海克斯大乱斗助手</title>
<style>
body{font-family:sans-serif;max-width:900px;margin:20px auto;padding:10px}
.container{display:flex;gap:15px}
#sidebar{width:220px;flex-shrink:0}
#sessionList{max-height:500px;overflow-y:auto;border:1px solid #ccc;border-radius:6px;padding:8px;background:#fafafa;font-size:13px}
.session-item{padding:6px 8px;cursor:pointer;border-bottom:1px solid #eee;border-radius:4px}
.session-item:hover{background:#eef}
#main{flex:1}
#chatBox{height:400px;overflow-y:auto;border:1px solid #ccc;padding:10px;margin-bottom:10px;background:#fafafa}
.msg{margin:5px 0;padding:8px;border-radius:8px;max-width:80%;white-space:pre-wrap}
.user{background:#dcf8c6;margin-left:auto;text-align:right}
.ai{background:#eee}
.item-icon{width:24px;height:24px;vertical-align:middle;border-radius:4px;margin:0 2px;border:1px solid #ddd}
#input{display:flex;gap:5px}
#input input{flex:1;padding:8px;border:1px solid #ccc;border-radius:4px}
button{padding:8px 16px;border:none;border-radius:4px;cursor:pointer}
#voiceBtn{background:#6f42c1;color:#fff;font-size:13px;padding:8px 12px}
#voiceBtn.recording{background:#dc3545}
.voice-hint{font-size:11px;color:#888;margin-top:4px}
.session-del{float:right;background:#f66;color:#fff;padding:1px 8px;font-size:11px;margin-left:6px}
</style>
</head>
<body>
<h3>海克斯大乱斗助手</h3>
<div class="container">
  <div id="sidebar">
    <h4 style="margin-bottom:4px">历史会话</h4>
    <div id="sessionList"></div>
  </div>
  <div id="main">
    <div id="chatBox"></div>
    <div id="input">
      <input id="msg" placeholder="语音识别显示...">
      <button id="voiceBtn">🎤 说话</button>
    </div>
    <div class="voice-hint">按住 <b>F6</b> 或点击 🎤 说话，松开自动识别并发送</div>    <div id="voiceStatus" style="font-size:11px;color:#b00;margin-top:4px"></div>
    <div id="curSession" style="font-size:12px;color:#888;margin-top:6px"></div>
  </div>
</div>
<script>
var sessionId = new Date().toISOString().replace(/[-:T]/g,'').slice(0,15);
var chatBox = document.getElementById('chatBox');

// 从游戏会话服务获取 sessionId（一局一轮对话，新局自动切换）
async function syncSession(){
    try{
        var r = await fetch('/api/game/state');
        var s = await r.json();
        if(s && s.sessionId){
            if(sessionId !== s.sessionId){
                sessionId = s.sessionId;
                chatBox.innerHTML = '';
                addSysMsg('🎮 新对局开始，已开启新会话');
                updateSessionLabel();
            }
        }
    }catch(e){}
}
syncSession();
setInterval(syncSession, 3000);

document.getElementById('voiceBtn').addEventListener('mousedown', startVoice);
document.getElementById('voiceBtn').addEventListener('mouseup', stopVoice);
document.getElementById('voiceBtn').addEventListener('mouseleave', stopVoice);
updateSessionLabel();
loadSessions();

// ===== 语音输入：页面加载预连 WS + 预热麦克风，F6 按下直接发音频 =====
var isRecording = false;
var stream = null;
var audioContext = null;
var processor = null;
var voiceWs = null;
var finalText = '';

function toPcm16(input){
    var pcm = new Int16Array(input.length);
    for(var i = 0; i < input.length; i++){
        var v = Math.max(-1, Math.min(1, input[i]));
        pcm[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
    }
    return pcm;
}

// 页面加载预连 WS（服务端懒启动 ASR：收到第一帧才识别，无空闲超时）
function connectVoiceWs(){
    var proto = location.protocol === 'https:' ? 'wss' : 'ws';
    voiceWs = new WebSocket(proto + '://' + location.host + '/voice-ws');
    voiceWs.binaryType = 'arraybuffer';
    voiceWs.onopen = function(){};
    voiceWs.onmessage = function(e){
        try{
            var data = JSON.parse(e.data);
            if(data.intermediate){
                if(isRecording) document.getElementById('msg').value = data.intermediate;
            } else if(data.final){
                finalText = data.final;
                document.getElementById('msg').value = data.final;
                if(/选海克斯|选哪个海克斯|帮我选海克斯/.test(data.final)){
                    addMsg('user', data.final);
                    document.getElementById('msg').value = '';
                    var div = addMsg('ai', '识别中...');
                    fetch('/api/game/hex/recognize?sessionId=' + sessionId).then(function(r){
                        var reader = r.body.getReader();
                        var decoder = new TextDecoder();
                        var buf = '';
                        var full = '';
                        div.innerHTML = '';
                        function pump(){
                            return reader.read().then(function(res){
                                if(res.done){
                                    var last = buf.split('\n').map(function(l){ return l.replace(/^data:\s*/, ''); }).join('\n').trim();
                                    if(last){ full += last; div.innerHTML = renderRich(full); scrollChat(); }
                                    return;
                                }
                                buf += decoder.decode(res.value, {stream:true});
                                var parts = buf.split('\n\n');
                                buf = parts.pop();
                                for(var i = 0; i < parts.length; i++){
                                    var lines = parts[i].split('\n').map(function(l){ return l.replace(/^data:\s*/, ''); });
                                    full += lines.join('\n').trim();
                                    div.innerHTML = renderRich(full);
                                    scrollChat();
                                }
                                return pump();
                            });
                        }
                        return pump();
                    }).catch(function(){ div.innerHTML = '识别失败'; scrollChat(); });
                } else {
                    send();
                }
            } else if(data.error){
                document.getElementById('voiceStatus').textContent = '识别失败: ' + data.error;
            }
        }catch(err){}
    };
    // 断线自动重连（服务端识别完关连接，重连预热下一次）
    voiceWs.onclose = function(){
        voiceWs = null;
        setTimeout(connectVoiceWs, 300);
    };
}

// 页面加载预热麦克风管线
function initAudio(){
    if(stream) return;
    navigator.mediaDevices.getUserMedia({audio: true}).then(function(s){
        stream = s;
        audioContext = new (window.AudioContext || window.webkitAudioContext)({sampleRate: 16000});
        if(audioContext.state === 'suspended'){ try{ audioContext.resume(); }catch(e){} }
        var source = audioContext.createMediaStreamSource(stream);
        processor = audioContext.createScriptProcessor(2048, 1, 1);
        source.connect(processor);
        processor.connect(audioContext.destination);
        processor.onaudioprocess = function(e){
            // 按住且 WS 已连接 → 发音频；WS 未连接则等预连（页面已加载预连）
            if(isRecording && voiceWs && voiceWs.readyState === WebSocket.OPEN){
                voiceWs.send(toPcm16(e.inputBuffer.getChannelData(0)).buffer);
            }
        };
    }).catch(function(){});
}

function startVoice(){
    if(isRecording) return;
    isRecording = true;
    finalText = '';
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceBtn').textContent = '🔴 说话中...';
    document.getElementById('voiceStatus').textContent = '正在听... 请说话';
    document.getElementById('msg').value = '';
}

function stopVoice(){
    if(!isRecording) return;
    isRecording = false;
    document.getElementById('voiceBtn').classList.remove('recording');
    document.getElementById('voiceBtn').textContent = '🎤 说话';
    if(voiceWs && voiceWs.readyState === WebSocket.OPEN){
        voiceWs.send('end');
    }
}

// 页面加载即预热：预连 WS + 麦克风
connectVoiceWs();
initAudio();

// 全局热键语音（全屏游戏可用）：轮询后端 /api/voice/state，F6 按住开始/松开停止
var voiceHotkeyPrev = false;
setInterval(function(){
    fetch('/api/voice/state').then(function(r){ return r.json(); }).then(function(s){
        var active = !!s.active;
        if(active && !voiceHotkeyPrev && !isRecording) startVoice();
        if(!active && voiceHotkeyPrev && isRecording) stopVoice();
        voiceHotkeyPrev = active;
    }).catch(function(){});
}, 300);

// 页面关闭时清理
window.addEventListener('beforeunload', function(){
    if(isRecording) stopVoice();
    if(voiceWs){ try{ voiceWs.close(); }catch(e){} voiceWs = null; }
});

async function send(){
    var input = document.getElementById('msg');
    var msg = input.value.trim();
    if(!msg) return;
    addMsg('user', msg);
    input.value = '';
    var div = addMsg('ai', '');
    try{
        var r = await fetch('/chat?sessionId=' + sessionId + '&message=' + encodeURIComponent(msg));
        var reader = r.body.getReader();
        var decoder = new TextDecoder();
        var buf = '';
        var full = '';   // 累计完整文本（流式重渲染，保证【img】标记跨 chunk 也能解析）
        while(true){
            var {done, value} = await reader.read();
            if(done) break;
            buf += decoder.decode(value, {stream: true});
            // 按 SSE 事件边界 \n\n 切分
            var parts = buf.split('\n\n');
            buf = parts.pop();
            for(var i = 0; i < parts.length; i++){
                // 每个事件可能多行：去每行开头的 data: 前缀
                var lines = parts[i].split('\n').map(function(l){ return l.replace(/^data:\s*/, ''); });
                full += lines.join('\n').trim();
                div.innerHTML = renderRich(full);
                scrollChat();
            }
        }
        // 尾部残余
        var last = buf.split('\n').map(function(l){ return l.replace(/^data:\s*/, ''); }).join('\n').trim();
        if(last){ full += last; div.innerHTML = renderRich(full); scrollChat(); }
        loadSessions();
    }catch(e){ div.innerHTML = '出错: ' + e; scrollChat(); }
}



async function loadSessions(){
    try{
        var r = await fetch('/sessions');
        var list = await r.json();
        var el = document.getElementById('sessionList');
        el.innerHTML = '';
        list.forEach(function(s){
            var d = document.createElement('div');
            d.className = 'session-item';
            var del = document.createElement('span');
            del.className = 'session-del';
            del.textContent = '删除';
            del.title = '删除该会话';
            del.onclick = function(ev){ ev.stopPropagation(); deleteSession(s.sessionId); };
            var text = document.createElement('span');
            text.innerHTML = s.createdAt;
            d.appendChild(del);
            d.appendChild(text);
            d.onclick = function(){ openSession(s.sessionId); };
            el.appendChild(d);
        });
    }catch(e){}
}

async function openSession(id){
    sessionId = id;
    updateSessionLabel();
    chatBox.innerHTML = '';
    try{
        var r = await fetch('/session/' + id);
        var msgs = await r.json();
        msgs.forEach(function(m){
            if(m.startsWith('USER:')) addMsg('user', m.slice(5));
            else if(m.startsWith('AI:')) addMsg('ai', m.slice(3));
        });
    }catch(e){ chatBox.innerHTML = '加载失败'; }
}

async function deleteSession(id){
    try{
        var r = await fetch('/session/' + id + '/delete');
        var txt = await r.text();
        if(txt.indexOf('已删除') === 0){
            if(id === sessionId){ chatBox.innerHTML = ''; updateSessionLabel(); }
            loadSessions();
        } else {
            alert(txt);
        }
    }catch(e){ alert('删除失败: ' + e); }
}

function updateSessionLabel(){
    document.getElementById('curSession').textContent = '当前会话: ' + sessionId;
}

function addMsg(role, txt){
    var d = document.createElement('div');
    d.className = 'msg ' + role;
    d.innerHTML = renderRich(txt || '...');
    chatBox.appendChild(d);
    scrollChat();
    return d;
}

// 名称→图片映射（后端 /api/images/mapping 加载）
var imageMap = null;
function loadImageMap(){
    fetch('/api/images/mapping').then(function(r){ return r.json(); }).then(function(m){
        imageMap = m;
    }).catch(function(){});
}
loadImageMap();

// 富文本渲染：
// 1. 解析 LLM 输出的 【img:URL】 标记 → 图标（主要方式，URL 来自工具返回真实数据）
// 2. 兜底：本地名称映射扫描（LLM 漏标时补）
function renderRich(text){
    if(!text) return '';
    var esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // 1. 解析 【img:URL】 标记 → 图标
    esc = esc.replace(/【img:([^】]+)】/g,
        '<img class="item-icon" src="$1" onerror="this.style.display=\'none\'">');
    // 2. 兜底：名称映射（LLM 未标但命中已知名字时）
    if(imageMap){
        var names = Object.keys(imageMap).sort(function(a,b){ return b.length - a.length; });
        var out = '';
        var i = 0;
        while(i < esc.length){
            var matched = false;
            for(var k = 0; k < names.length; k++){
                var n = names[k];
                if(!n || n.length < 2) continue;
                if(esc.substr(i, n.length) === n){
                    var prev = i > 0 ? esc.charAt(i-1) : '';
                    var next = i + n.length < esc.length ? esc.charAt(i + n.length) : '';
                    var isWord = function(ch){ return /[a-zA-Z0-9]/.test(ch); };
                    if(!isWord(prev) && !isWord(next)){
                        out += '<img class="item-icon" src="' + imageMap[n] + '" alt="' + n + '" title="' + n + '" onerror="this.style.display=\'none\'">' + n;
                        i += n.length;
                        matched = true;
                        break;
                    }
                }
            }
            if(!matched){
                out += esc.charAt(i);
                i++;
            }
        }
        esc = out;
    }
    return esc;
}

// 转义正则特殊字符
function escaped(s){
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 滚动到底部（流式输出时保持最新可见）
function scrollChat(){
    chatBox.scrollTop = chatBox.scrollHeight;
}

// 系统消息（居中灰色提示条）
function addSysMsg(txt){
    var d = document.createElement('div');
    d.style.cssText = 'text-align:center;color:#999;font-size:12px;margin:8px 0;padding:4px;background:#f0f0f0;border-radius:4px';
    d.innerText = txt;
    chatBox.appendChild(d);
    chatBox.scrollTop = chatBox.scrollHeight;
    return d;
}
</script>
</body>
</html>
